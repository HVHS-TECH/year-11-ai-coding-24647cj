<!DOCTYPE html>
<html>
<head>
<title>My AI game</title>
</head>
<body>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
	html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#70c5ce}
	#gameWrap{display:flex;align-items:center;justify-content:center;height:100%}
	canvas{background:#70c5ce;box-shadow:0 6px 18px rgba(0,0,0,0.25);border-radius:8px}
	#hud{position:fixed;left:50%;transform:translateX(-50%);top:14px;color:#fff;font-weight:700;text-align:center}
	#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="hud">
	<div id="score">Score: 0</div>
	<div id="best">Best: 0</div>
</div>
<div id="gameWrap">
	<canvas id="game" width="480" height="640"></canvas>
</div>
<div id="hint">Press Space / Click / Tap to flap — try to pass the pipes</div>

<script src="game.js"></script>
</body>
</html>
